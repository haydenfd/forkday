<!doctype html>
<html lang="en">
  <body>
    <div data-automation-id="signInContent">
      <div>
        <div>
          <h3 id="authViewTitle">Sign In</h3>
          <form data-automation-id="signInFormo">
            <div data-automation-id="formField-email">
              <label for="input-6"
                ><span
                  >Email Address<abbr aria-hidden="true">*</abbr></span
                ></label
              >
              <div>
                <div>
                  <input
                    type="text"
                    data-automation-id="email"
                    id="input-6"
                    aria-required="true"
                  />
                </div>
                <div></div>
              </div>
            </div>
            <div>
              <div data-automation-id="formField-password">
                <label for="input-7"
                  ><span>Password<abbr aria-hidden="true">*</abbr></span></label
                >
                <div>
                  <div>
                    <input
                      type="password"
                      data-automation-id="password"
                      id="input-7"
                      aria-required="true"
                    />
                  </div>
                  <div></div>
                </div>
              </div>
            </div>
            <div>
              <div>
                <div data-automation-id="noCaptchaWrapper">
                  <div>
                    <div>
                      <div
                        aria-label="Submit"
                        role="button"
                        tabindex="0"
                        data-automation-id="click_filter"
                      ></div>
                      <button
                        type="submit"
                        data-automation-id="signInSubmitButton"
                        tabindex="-2"
                        aria-hidden="true"
                      >
                        Sign In
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
          <div>
            Don't have an account yet?<button
              data-automation-id="createAccountLink"
            >
              Create Account
            </button>
          </div>
          <div>
            <button data-automation-id="forgotPasswordLink">
              Forgot your password?
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
