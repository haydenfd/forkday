<!doctype html>
<html lang="en">
  <body>
    <div data-automation-id="signInContent">
      <div>
        <div>
          <div>
            <h2 id="authViewTitle">Sign In</h2>
            <div>
              <div data-automation-id="richText">
                <p>
                  <span
                    ><span
                      >Welcome! Create an account to manage your applications
                      with us. Account creation and use is subject to the
                    </span></span
                  ><a
                    ><span
                      ><u
                        ><span> Workday Recruitment Privacy Statement</span></u
                      ></span
                    ></a
                  ><span><span>.</span></span>
                </p>
              </div>
            </div>
            <div>
              <div>
                <div>
                  <div>
                    <button
                      type="button"
                      aria-label="Sign in with Apple"
                      data-automation-id="AppleSignInButton"
                    >
                      <div>Sign in with Apple</div>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <div>
                <div>
                  <div>
                    <button
                      type="button"
                      aria-label="Sign in with Google"
                      data-automation-id="GoogleSignInButton"
                    >
                      <div>
                        <div></div>
                        Sign in with Google
                      </div>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <div><span>OR</span></div>
              <div>
                <div>
                  <div>
                    <button data-automation-id="SignInWithEmailButton">
                      Sign in with email
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
